application:
  subdomain: tduck
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://tduck-platform:8999/

services:
  mysql:
    # upstream: mysql:8.0.36
    image: mysql:8.0.36
    environment:
      - MYSQL_ROOT_PASSWORD={{ stable_secret "mysql_password" }}
      - MYSQL_DATABASE=tduck
      - MYSQL_ROOT_HOST=%
      - TZ=Asia/Shanghai
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    binds:
      - /lzcapp/var/db:/var/lib/mysql
      - /lzcapp/pkg/content:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost
      start_period: 5m30s

  tduck-platform:
    # upstream: tduckcloud/tduck-platform:latest
    image: tduckcloud/tduck-platform:latest
    environment:
      - JAVA_OPTS=-Duser.language=zh -XX:+UseG1GC
      - TZ=Asia/Shanghai
      - spring.datasource.url=jdbc:mysql://mysql:3306/tduck?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&tinyInt1isBit=false&allowPublicKeyRetrieval=true
      - spring.datasource.username=root
      - spring.datasource.password={{ stable_secret "mysql_password" }}
    depends_on:
      - mysql
    binds:
      - /lzcapp/var/upload:/application/BOOT-INF/lib/upload
